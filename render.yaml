services:
  - type: web
    name: looca-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt && python scripts/download_offline_models.py --fast --whisper-model tiny
    startCommand: cd backend && uvicorn app.hybrid_main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: looca-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: VOICE_MODE
        value: auto
      - key: OFFLINE_STRICT
        value: "false"
      - key: OFFLINE_STT_ENGINE
        value: faster-whisper
      - key: OFFLINE_WHISPER_MODEL
        value: tiny
      - key: OFFLINE_WHISPER_DEVICE
        value: cpu
      - key: OFFLINE_WHISPER_COMPUTE_TYPE
        value: int8
      - key: OFFLINE_CPU_THREADS
        value: "2"
      - key: OFFLINE_TTS_ENGINE
        value: auto
      - key: LLM_PROVIDER
        value: auto

  - type: web
    name: looca-web
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: looca-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: LOOCA_API_HOSTPORT
        fromService:
          type: web
          name: looca-api
          property: hostport

databases:
  - name: looca-db
    plan: free
    region: singapore
    databaseName: looca
    user: looca
